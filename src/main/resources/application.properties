# TÊN ỨNG DỤNG
spring.application.name=ASM_java5

# CẤU HÌNH THYMELEAF
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# CẤU HÌNH MÃ HÓA TIẾNG VIỆT UTF-8
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# KẾT NỐI CƠ SỞ DỮ LIỆU SQL SERVER
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ASMJava5;encrypt=true;trustServerCertificate=true}
spring.datasource.username=sa
spring.datasource.password=123456

# CẤU HÌNH JPA VÀ HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# CẤU HÌNH GỬI EMAIL BẰNG GMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
