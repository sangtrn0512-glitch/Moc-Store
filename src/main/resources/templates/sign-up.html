<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{shared/layout :: page('Đăng ký', ~{::section})}">
<body>
<section>
    <h1>Đăng ký tài khoản</h1>

    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <p th:if="${success}" th:text="${success}" role="status"></p>

    <form th:action="@{/account/sign-up}" method="post">
<input type="hidden" name="csrf" th:value="${session.csrf}">
        <label for="username">Tên đăng nhập</label>
        <input id="username"
               name="username"
               th:value="${username}"
               type="text"
               maxlength="50"
               autocomplete="username"
               required>

        <label for="fullName">Họ tên</label>
        <input id="fullName"
               name="fullName"
               th:value="${fullName}"
               type="text"
               maxlength="100"
               autocomplete="name"
               required>

        <label for="email">Email</label>
        <input id="email"
               name="email"
               th:value="${email}"
               type="email"
               maxlength="255"
               autocomplete="email"
               required>

        <label for="password">Mật khẩu</label>
        <input id="password"
               name="password"
               type="password"
               minlength="8"
               autocomplete="new-password"
               required>

        <button type="submit">Tạo tài khoản</button>
    </form>
</section>
</body>
</html>
