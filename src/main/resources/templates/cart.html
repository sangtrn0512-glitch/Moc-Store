<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{shared/layout :: page('Giỏ hàng', ~{::section})}">
<body>
<section><h1>Giỏ hàng</h1>
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Sản phẩm</th>
                <th>Đơn giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="5">Giỏ hàng của bạn đang trống.</td>
            </tr>

            <tr th:each="item : ${items}">
                <td th:text="${item.product.name}"></td>
                <td th:text="${item.unitPrice} + ' ₫'"></td>
                <td>
                    <form th:action="@{/cart/update}" method="post">
<input type="hidden" name="csrf" th:value="${session.csrf}">
                        <input type="hidden"
                               name="productId"
                               th:value="${item.product.id}">

                        <input type="number"
                               name="quantity"
                               th:value="${item.quantity}"
                               min="1"
                               max="99"
                               required
                               aria-label="Số lượng">


                        <button type="submit">Cập nhật</button>
                    </form>
                </td>
                <td th:text="${item.amount} + ' ₫'"></td>
                <td>
                    <form th:action="@{/cart/remove/{id}(id=${item.product.id})}"
                          method="post">
<input type="hidden" name="csrf" th:value="${session.csrf}">
                        <button type="submit">Xóa</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p>
        Tổng tiền:
        <strong th:text="${total} + ' ₫'"></strong>
    </p>
    <form th:if="${!#lists.isEmpty(items)}"
          th:action="@{/cart/clear}"
          method="post"
          onsubmit="return confirm('Bạn muốn xóa toàn bộ giỏ hàng?');">
<input type="hidden" name="csrf" th:value="${session.csrf}">
        <button type="submit">Xóa toàn bộ giỏ</button>
    </form>
    <a class="button" href="/product/list">Khám phá sản phẩm <span aria-hidden="true">↗</span></a>
<a class="button" th:if="${!#lists.isEmpty(items)}" href="/order/checkout">Đặt hàng</a>
</section>
</body>
</html>
