<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="controls"><form method="get" class="list-search"><label for="keyword">Tìm kiếm</label><input id="keyword" name="keyword" th:value="${keyword}"><label for="sort">Sắp xếp</label><select id="sort" name="sort"><option value="id" th:selected="${sort == 'id'}">Mặc định</option><option value="name" th:selected="${sort == 'name'}">Tên tăng dần</option><option value="price" th:selected="${sort == 'price'}">Giá tăng dần (sản phẩm)</option></select><button>Tìm kiếm</button></form><nav th:if="${pages != null}" aria-label="Phân trang"><a th:if="${page > 0}" th:href="@{''(page=${page - 1},keyword=${keyword},sort=${sort})}">← Trước</a> <span th:text="'Trang ' + ${page + 1} + ' / ' + ${pages} + ' · ' + ${count} + ' kết quả'"></span> <a th:if="${page + 1 < pages}" th:href="@{''(page=${page + 1},keyword=${keyword},sort=${sort})}">Sau →</a></nav></div></body></html>
