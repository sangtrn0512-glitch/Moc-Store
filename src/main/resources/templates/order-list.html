<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{shared/layout :: page('Đơn hàng của tôi', ~{::section})}"><body><section><h1>Đơn hàng của tôi</h1><p class="admin-error" th:if="${error}" th:text="${error}" role="alert"></p><p class="admin-success" th:if="${success}" th:text="${success}" role="status"></p><div class="table-wrap"><table><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="order : ${orders}"><td th:text="${order.id}"></td><td th:text="${order.createDate}"></td><td th:text="${order.status}"></td><td><a th:href="@{/order/detail/{id}(id=${order.id})}">Chi tiết</a></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="4">Bạn chưa có đơn hàng nào.</td></tr></tbody></table></div></section></body></html>
