<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{shared/admin-layout :: page('10 khách hàng VIP', ~{::section})}"><body><section><h1>10 khách hàng VIP</h1><p class="admin-error" th:if="${error}" th:text="${error}" role="alert"></p><p class="admin-success" th:if="${success}" th:text="${success}" role="status"></p><p>Chỉ tính đơn hàng đã hoàn thành.</p><div class="table-wrap"><table><thead><tr><th>Tài khoản</th><th>Khách hàng</th><th>Tổng tiền</th><th>Ngày mua đầu</th><th>Ngày mua cuối</th></tr></thead><tbody><tr th:each="row : ${rows}"><td th:text="${row.username}"></td><td th:text="${row.customer}"></td><td th:text="${row.total}"></td><td th:text="${row.firstDate}"></td><td th:text="${row.lastDate}"></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="5">Chưa có dữ liệu.</td></tr></tbody></table></div></section></body></html>
