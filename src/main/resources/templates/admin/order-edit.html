<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{shared/admin-layout :: page('Chi tiết và cập nhật đơn', ~{::section})}"><body><section><h1>Chi tiết và cập nhật đơn</h1><p>PENDING: chờ xác nhận · CONFIRMED: đã xác nhận · SHIPPING: đang giao · COMPLETED: hoàn thành · CANCELLED: đã hủy.</p><p class="admin-error" th:if="${error}" th:text="${error}" role="alert"></p><p class="admin-success" th:if="${success}" th:text="${success}" role="status"></p><form method="post" action="/admin/order/update">
<input type="hidden" name="csrf" th:value="${session.csrf}"><input type="hidden" name="id" th:value="${order.id}"><label for="address">Địa chỉ</label><input id="address" name="address" type="text" required th:value="${order.address}" maxlength="500"><label for="phone">Điện thoại</label><input id="phone" name="phone" type="tel" required th:value="${order.phone}" maxlength="20"><label for="status">Trạng thái</label><select id="status" name="status"><option th:each="s : ${ {'PENDING','CONFIRMED','SHIPPING','COMPLETED','CANCELLED'} }" th:value="${s}" th:text="${s}" th:selected="${s == order.status}"></option></select><button>Lưu đơn hàng</button></form><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Đơn giá lúc mua</th><th>Số lượng</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="item : ${details}"><td th:text="${item.product.name}"></td><td th:text="${item.price}"></td><td th:text="${item.quantity}"></td><td th:text="${item.price * item.quantity}"></td></tr></tbody></table></div><p th:text="'Tổng: ' + ${total} + ' ₫'"></p><a href="/admin/order/index">Danh sách đơn</a><form method="post" action="/admin/order/item" th:if="${order.status == 'PENDING'}"><input type="hidden" name="csrf" th:value="${session.csrf}"><input type="hidden" name="orderId" th:value="${order.id}"><h2>Thêm / cập nhật số lượng</h2><label for="productId">Sản phẩm</label><select id="productId" name="productId"><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option></select><label for="quantity">Số lượng</label><input id="quantity" name="quantity" type="number" min="1" max="99" required><button>Lưu dòng hàng</button></form><form th:each="d : ${details}" th:if="${order.status == 'PENDING'}" method="post" action="/admin/order/item/delete"><input type="hidden" name="csrf" th:value="${session.csrf}"><input type="hidden" name="orderId" th:value="${order.id}"><input type="hidden" name="detailId" th:value="${d.id}"><button th:text="'Xóa khỏi đơn: ' + ${d.product.name}"></button></form></section></body></html>
