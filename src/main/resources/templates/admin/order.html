<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{shared/admin-layout :: page('Quản lý đơn hàng', ~{::section})}"><body><section><h1>Quản lý đơn hàng</h1><div th:replace="~{shared/paging :: controls}"></div><p class="admin-error" th:if="${error}" th:text="${error}" role="alert"></p><p class="admin-success" th:if="${success}" th:text="${success}" role="status"></p><form method="post" action="/admin/order/create">
<input type="hidden" name="csrf" th:value="${session.csrf}"><h2>Tạo đơn cho khách</h2><label for="username">Khách hàng</label><select id="username" name="username" required><option th:each="a : ${accounts}" th:value="${a.username}" th:text="${a.username}"></option></select><label for="productId">Sản phẩm</label><select id="productId" name="productId" required><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option></select><label for="quantity">Số lượng</label><input id="quantity" name="quantity" type="number" required min="1" max="99" value="1"><label for="address">Địa chỉ</label><input id="address" name="address" type="text" required maxlength="500"><label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel" required maxlength="20"><button>Tạo đơn</button></form><div class="table-wrap"><table><thead><tr><th>Mã</th><th>Khách</th><th>Ngày đặt</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="o : ${orders}"><td th:text="${o.id}"></td><td th:text="${o.account.username}"></td><td th:text="${o.createDate}"></td><td th:text="${o.status}"></td><td><a th:href="@{/admin/order/edit/{id}(id=${o.id})}">Chi tiết / Sửa</a><form class="inline-form" method="post" th:action="@{/admin/order/delete/{id}(id=${o.id})}" onsubmit="return confirm('Xóa đơn hàng này?')">
<input type="hidden" name="csrf" th:value="${session.csrf}"><button>Xóa</button></form></td></tr></tbody></table></div></section></body></html>
