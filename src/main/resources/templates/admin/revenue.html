<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{shared/admin-layout :: page('Doanh thu theo loại', ~{::section})}"><body><section><h1>Doanh thu theo loại</h1><p class="admin-error" th:if="${error}" th:text="${error}" role="alert"></p><p class="admin-success" th:if="${success}" th:text="${success}" role="status"></p><p>Chỉ tính đơn hàng đã hoàn thành.</p><div class="table-wrap"><table><thead><tr><th>Loại hàng</th><th>Doanh thu</th><th>Số lượng</th><th>Giá cao nhất</th><th>Giá thấp nhất</th><th>Giá trung bình</th></tr></thead><tbody><tr th:each="row : ${rows}"><td th:text="${row.category}"></td><td th:text="${row.revenue}"></td><td th:text="${row.quantity}"></td><td th:text="${row.highest}"></td><td th:text="${row.lowest}"></td><td th:text="${row.average}"></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="6">Chưa có dữ liệu.</td></tr></tbody></table></div></section></body></html>
