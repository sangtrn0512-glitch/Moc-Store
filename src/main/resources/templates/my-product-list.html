<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{shared/layout :: page('Sản phẩm đã mua', ~{::section})}"><body><section><h1>Sản phẩm đã mua</h1><p class="admin-error" th:if="${error}" th:text="${error}" role="alert"></p><p class="admin-success" th:if="${success}" th:text="${success}" role="status"></p><p>Các sản phẩm thuộc đơn đã hoàn thành.</p><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Đơn giá lúc mua</th><th>Số lượng</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="item : ${details}"><td th:text="${item.product.name}"></td><td th:text="${item.price}"></td><td th:text="${item.quantity}"></td><td th:text="${item.price * item.quantity}"></td></tr></tbody></table></div><p th:if="${#lists.isEmpty(details)}">Chưa có sản phẩm trong đơn hoàn thành.</p></section></body></html>
