name: Java CI Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        type: choice
        options:
          - all
          - smoke
        default: all

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run all tests
        if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
        run: mvn -B test

      - name: Run smoke tests
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke'
        run: mvn -B test -Dgroups=smoke

      - name: Generate HTML test report
        if: always()
        continue-on-error: true
        run: >
          mvn -B
          org.apache.maven.plugins:maven-surefire-report-plugin:3.6.0:report-only

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            target/surefire-reports/
            target/reports/
          if-no-files-found: warn
